<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>College Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow space-y-6">
    <h1 class="text-2xl font-bold text-gray-800">College Integration Credentials</h1>
    <p class="text-sm text-gray-600">Copy these credentials and paste them into your ERP system settings.</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Target API Endpoint URL</label>
        <input type="text" readonly value="http://localhost:5000/api/v1/students/sync" class="w-full p-2 border rounded bg-gray-50 font-mono text-sm">
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">Your Secret API Key</label>
        <div class="flex gap-2">
          <input id="keyDisplay" type="text" readonly value="Click 'Fetch My Key' below" class="w-full p-2 border rounded bg-gray-50 font-mono text-sm">
        </div>
      </div>

      <button onclick="fetchKey()" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">
        Fetch API Key (D.J. Engineering - C-12345)
      </button>
    </div>
  </div>

  <script>
    async function fetchKey() {
      const res = await fetch('/api/college/credentials/C-12345');
      const data = await res.json();
      const input = document.getElementById('keyDisplay');
      if(data.apiKey) {
        input.value = data.apiKey;
      } else {
        input.value = "STATUS: PENDING (Admin has not approved yet)";
      }
    }
  </script>
</body>
</html>
